name: Build XLive Splitter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy customtkinter
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "XLive Splitter" --add-data "$(python3 -c 'import customtkinter; import os; print(os.path.dirname(customtkinter.__file__))'):customtkinter/" "xlive_splitter_mac.py"
    
    # NEW STEP: Compress the .app into a zip file manually to preserve the Mac app structure
    - name: Zip Mac App
      run: |
        cd dist
        zip -r "XLive_Splitter_macOS.zip" "XLive Splitter.app"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: XLive_Splitter_macOS
        path: dist/XLive_Splitter_macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy customtkinter
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "XLive Splitter" --collect-all customtkinter "xlive_splitter_windows.py"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: XLive_Splitter_Windows
        path: dist/XLive Splitter
