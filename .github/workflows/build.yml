name: Build XLive Splitter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Report Tcl/Tk version
      run: |
        python -c "import tkinter, sys; v = tkinter.Tcl().eval('info patchlevel'); print('Tcl/Tk patchlevel:', v); print('python:', sys.version)"
        python -c "import tkinter; print('TK_VERSION=' + tkinter.Tcl().eval('info patchlevel'))" >> "$GITHUB_STEP_SUMMARY"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy customtkinter tkinterdnd2
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "XLive Splitter" --add-data "$(python3 -c 'import customtkinter; import os; print(os.path.dirname(customtkinter.__file__))'):customtkinter/" --collect-all tkinterdnd2 "Xlive_Splitter_Mac.py"

    # Zip the .app manually to preserve the Mac bundle structure
    - name: Zip Mac App
      run: |
        cd dist
        zip -r "XLive_Splitter_macOS.zip" "XLive Splitter.app"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: XLive_Splitter_macOS
        path: dist/XLive_Splitter_macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Report Tcl/Tk version
      run: |
        python -c "import tkinter, sys; v = tkinter.Tcl().eval('info patchlevel'); print('Tcl/Tk patchlevel:', v); print('python:', sys.version)"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy customtkinter tkinterdnd2
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "XLive Splitter" --collect-all customtkinter --collect-all tkinterdnd2 "Xlive_Splitter_Windows.py"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: XLive_Splitter_Windows
        path: dist/XLive Splitter
