name: Build XLive Splitter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A second push to the same branch cancels the run still in flight, so you
# aren't paying for builds of code that's already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which platform files actually changed. Everything else keys off
  # this job's outputs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mac: ${{ steps.decide.outputs.mac }}
      windows: ${{ steps.decide.outputs.windows }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            shared: &shared
              - '.github/workflows/build.yml'
            mac:
              - *shared
              - 'Xlive_Splitter_Mac.py'
            windows:
              - *shared
              - 'Xlive_Splitter_Windows.py'

      - name: Decide what to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs always build both, so there's a way to get a fresh
            # pair of artifacts without touching the source.
            echo "mac=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "mac=${{ steps.filter.outputs.mac }}" >> "$GITHUB_OUTPUT"
            echo "windows=${{ steps.filter.outputs.windows }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "Mac build:     ${{ steps.decide.outputs.mac }}"     >> "$GITHUB_STEP_SUMMARY"
          echo "Windows build: ${{ steps.decide.outputs.windows }}" >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy customtkinter
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "XLive Splitter" --add-data "$(python3 -c 'import customtkinter; import os; print(os.path.dirname(customtkinter.__file__))'):customtkinter/" "Xlive_Splitter_Mac.py"

    # Compress the .app into a zip manually to preserve the Mac app structure
    - name: Zip Mac App
      run: |
        cd dist
        zip -r "XLive_Splitter_macOS.zip" "XLive Splitter.app"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: XLive_Splitter_macOS
        path: dist/XLive_Splitter_macOS.zip

  build-windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy customtkinter
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "XLive Splitter" --collect-all customtkinter "Xlive_Splitter_Windows.py"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: XLive_Splitter_Windows
        path: dist/XLive Splitter
